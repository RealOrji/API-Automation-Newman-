name: AI Generate Tests

# Manual on purpose: every run calls the Claude API, which costs money.
on:
  workflow_dispatch:
    inputs:
      max_tests:
        description: Maximum number of test cases Claude may plan
        default: '30'
      open_pr:
        description: Open a pull request with the generated collection
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check for the API key
        if: env.ANTHROPIC_API_KEY == ''
        run: |
          echo "::error::Add an ANTHROPIC_API_KEY repository secret (Settings > Secrets and variables > Actions)."
          exit 1

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Generate tests from the OpenAPI spec
        run: npm run ai:generate -- --max-tests "${{ inputs.max_tests }}"

      - name: Lint the generated collection
        run: npm run lint

      # Generated tests are a proposal. If some fail, the triage below says whether
      # the API or the test is wrong, which is exactly what a reviewer needs.
      - name: Run the generated tests
        id: run
        continue-on-error: true
        run: npm run test:generated

      - name: Summarise results (AI triage on failure)
        if: always()
        run: npm run ai:analyze

      - name: Upload generated collection and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-generated-tests
          path: |
            collections/generated/
            reports/

      # Needs "Allow GitHub Actions to create and approve pull requests"
      # under Settings > Actions > General.
      - name: Open a pull request
        if: inputs.open_pr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ai/generated-tests
          commit-message: Update AI-generated API tests
          title: Update AI-generated API tests
          body: |
            Test plan generated by Claude from `api/openapi.yaml`.

            - Newman result: **${{ steps.run.outcome }}**
            - Review `collections/generated/*.plan.json` first: it is the readable list of what is tested and why.
            - The run's job summary has the results table and any AI triage.
          add-paths: collections/generated/
